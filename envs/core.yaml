name: 3ndetect-core
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  # Snakemake 8 inspects rule-level Conda environments even when executables
  # are already on PATH; current Snakemake requires Conda >=24.7.1.
  - conda>=24.7.1
  - bwa=0.7.19
  - samtools=1.23
  - bcftools=1.23
  - gatk4=4.6.2.0
  - meryl=1.4.2
  - pandas=2.2
  - numpy=1.26
  - scipy=1.15
  - matplotlib=3.10
  - pillow=11  # matplotlib writes publication TIFFs (LZW) via Pillow
  - jinja2=3.1
  - pyyaml=6
  - pysam=0.23
  - pytest=8.3
  - snakemake-minimal=8.30
